[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.1.0"
description = "Revision-specific proposal generation and approval"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "docxtpl==0.20.2", "argon2-cffi>=23,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["docflow*"]

[tool.setuptools.package-data]
docflow = ["templates/*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: PostgreSQL concurrency checks", "conversion: requires LibreOffice"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
